<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Merry Christmas · 圣诞音乐盒</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #121c33 0%, #070b14 65%, #020408 100%);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    .header-title {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      width: 90%;
    }
    .header-title h1 {
      font-size: clamp(1.5rem, 4.5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ffe29f, #ffa99f, #ffd700, #fff3b0);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
      text-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
    }
    .header-title p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 1px;
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* 顶部控制按钮组 */
    .top-controls {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .icon-btn {
      background: rgba(20, 28, 48, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      color: #ffe89e;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }
    .icon-btn:active {
      transform: scale(0.95);
    }
    .icon-btn.playing {
      border-color: #ffd700;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.45);
    }
    .music-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 13px;
    }
    .music-bars span {
      width: 2.5px;
      height: 5px;
      background: #ffd700;
      border-radius: 2px;
      transition: height 0.2s;
    }
    .playing .music-bars span:nth-child(1) { animation: bar 0.7s ease-in-out infinite alternate; }
    .playing .music-bars span:nth-child(2) { animation: bar 0.5s ease-in-out infinite alternate 0.2s; }
    .playing .music-bars span:nth-child(3) { animation: bar 0.8s ease-in-out infinite alternate 0.35s; }
    @keyframes bar {
      0% { height: 3px; }
      100% { height: 13px; }
    }

    /* 控制面板 */
    .panel {
      position: fixed;
      top: 66px;
      right: 18px;
      z-index: 20;
      width: 250px;
      background: rgba(16, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      display: none;
    }
    .panel.open {
      display: block;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .panel-group {
      margin-bottom: 14px;
    }
    .panel-group:last-child {
      margin-bottom: 0;
    }
    .panel-label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .theme-btn {
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .theme-btn.active {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.2);
      color: #ffe89e;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #ffd700;
      cursor: pointer;
    }

    /* 首次点击开启音乐提示条 */
    .music-toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(20, 28, 48, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #ffe89e;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      transition: opacity 0.4s ease;
    }
    .music-toast.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="header-title">
    <h1>MERRY CHRISTMAS</h1>
    <p>轻触屏幕放烟花 · 拖拽旋转视角</p>
  </div>

  <div class="top-controls">
    <button class="icon-btn" id="musicBtn" title="开关圣诞音乐">
      <span class="music-bars"><span></span><span></span><span></span></span>
      <span id="musicText">播放音乐</span>
    </button>
    <button class="icon-btn" id="panelBtn">✨ 魔法设置</button>
  </div>

  <div class="panel" id="controlPanel">
    <div class="panel-group">
      <div class="panel-label"><span>灯光配色主题</span></div>
      <div class="theme-grid">
        <button class="theme-btn active" data-theme="classic">🎄 经典暖彩</button>
        <button class="theme-btn" data-theme="frozen">❄️ 冰雪奇缘</button>
        <button class="theme-btn" data-theme="gold">✨ 流金岁月</button>
        <button class="theme-btn" data-theme="galaxy">🌌 幻彩星河</button>
      </div>
    </div>
    <div class="panel-group">
      <div class="panel-label"><span>音乐曲目</span></div>
      <div class="theme-grid">
        <button class="theme-btn active" data-song="0">🎶 祝你圣诞快乐</button>
        <button class="theme-btn" data-song="1">🔔 铃儿响叮当</button>
      </div>
    </div>
    <div class="panel-group">
      <div class="panel-label"><span>旋转速度</span><span id="speedVal">1.0x</span></div>
      <input type="range" id="speedRange" min="0" max="3" step="0.1" value="1" />
    </div>
    <div class="panel-group">
      <div class="panel-label"><span>飞雪密度</span><span id="snowVal">中</span></div>
      <input type="range" id="snowRange" min="200" max="2000" step="100" value="1000" />
    </div>
  </div>

  <div class="music-toast" id="musicToast">🎵 点击屏幕任意位置开启圣诞八音盒音乐</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ==================== 1. 圣诞八音盒 Web Audio 合成器 ====================
    class ChristmasMusicBox {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
        this.noteIndex = 0;
        this.songIndex = 0;

        // 音符频率表
        this.freqs = {
          C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
          C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
          C3: 130.81, F3: 174.61, G3: 196.00, A3: 220.00, E3: 164.81, D3: 146.83
        };

        // 曲目列表：[主旋律音符, 时值(拍), 伴奏和弦低音]
        this.songs = [
          // 0: We Wish You a Merry Christmas
          [
            ['D4', 1, 'G3'],
            ['G4', 1, 'G3'], ['G4', 0.5, null], ['A4', 0.5, null], ['G4', 0.5, null], ['F4', 0.5, null],
            ['E4', 1, 'C3'], ['E4', 1, 'E3'], ['E4', 1, 'C3'],
            ['A4', 1, 'A3'], ['A4', 0.5, null], ['B4', 0.5, null], ['A4', 0.5, null], ['G4', 0.5, null],
            ['F4', 1, 'D3'], ['D4', 1, 'F3'], ['D4', 1, 'D3'],
            ['B4', 1, 'G3'], ['B4', 0.5, null], ['C5', 0.5, null], ['B4', 0.5, null], ['A4', 0.5, null],
            ['G4', 1, 'E3'], ['E4', 1, 'G3'], ['D4', 0.5, null], ['D4', 0.5, null],
            ['E4', 1, 'C3'], ['A4', 1, 'D3'], ['F4', 1, 'D3'],
            ['G4', 2, 'G3'], [null, 1, null]
          ],
          // 1: Jingle Bells (铃儿响叮当)
          [
            ['E4', 1, 'C3'], ['E4', 1, 'G3'], ['E4', 2, 'C3'],
            ['E4', 1, 'C3'], ['E4', 1, 'G3'], ['E4', 2, 'C3'],
            ['E4', 1, 'C3'], ['G4', 1, 'E3'], ['C4', 1.5, 'G3'], ['D4', 0.5, null],
            ['E4', 4, 'C3'],
            ['F4', 1, 'F3'], ['F4', 1, 'A3'], ['F4', 1.5, 'F3'], ['F4', 0.5, null],
            ['F4', 1, 'C3'], ['E4', 1, 'G3'], ['E4', 1, 'C3'], ['E4', 0.5, null], ['E4', 0.5, null],
            ['E4', 1, 'G3'], ['D4', 1, 'D3'], ['D4', 1, 'G3'], ['E4', 1, 'D3'],
            ['D4', 2, 'G3'], ['G4', 2, 'G3'],
            ['E4', 1, 'C3'], ['E4', 1, 'G3'], ['E4', 2, 'C3'],
            ['E4', 1, 'C3'], ['E4', 1, 'G3'], ['E4', 2, 'C3'],
            ['E4', 1, 'C3'], ['G4', 1, 'E3'], ['C4', 1.5, 'G3'], ['D4', 0.5, null],
            ['E4', 4, 'C3'],
            ['F4', 1, 'F3'], ['F4', 1, 'A3'], ['F4', 1.5, 'F3'], ['F4', 0.5, null],
            ['F4', 1, 'C3'], ['E4', 1, 'G3'], ['E4', 1, 'C3'], ['E4', 0.5, null], ['E4', 0.5, null],
            ['G4', 1, 'G3'], ['G4', 1, 'D3'], ['F4', 1, 'G3'], ['D4', 1, 'F3'],
            ['C4', 3, 'C3'], [null, 1, null]
          ]
        ];
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, duration, volume = 0.16, type = 'sine') {
        if (!this.ctx || !freq) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const overtone = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        // 八音盒泛音效果
        overtone.type = 'triangle';
        overtone.frequency.setValueAtTime(freq * 2, now);
        const overGain = this.ctx.createGain();
        overGain.gain.setValueAtTime(volume * 0.25, now);
        overGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.9);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 1.35);

        osc.connect(gain);
        overtone.connect(overGain);
        overGain.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        overtone.start(now);
        osc.stop(now + duration * 1.4);
        overtone.stop(now + duration * 1.4);
      }

      playSparkle() {
        if (!this.isPlaying) return;
        this.initContext();
        const chimes = [1046.5, 1318.5, 1567.98, 2093.0];
        const f = chimes[Math.floor(Math.random() * chimes.length)];
        this.playTone(f, 0.35, 0.06, 'sine');
      }

      scheduleNext() {
        if (!this.isPlaying) return;
        const currentSong = this.songs[this.songIndex];
        const [note, beats, bass] = currentSong[this.noteIndex];
        const beatMs = 420;
        const durationSec = (beats * beatMs) / 1000;

        if (note && this.freqs[note]) {
          this.playTone(this.freqs[note], durationSec, 0.17, 'sine');
        }
        if (bass && this.freqs[bass]) {
          this.playTone(this.freqs[bass], durationSec * 1.5, 0.08, 'triangle');
        }

        this.noteIndex = (this.noteIndex + 1) % currentSong.length;
        this.timer = setTimeout(() => this.scheduleNext(), beats * beatMs);
      }

      start() {
        this.initContext();
        if (this.isPlaying) return;
        this.isPlaying = true;
        this.scheduleNext();
        updateMusicUI(true);
      }

      stop() {
        this.isPlaying = false;
        clearTimeout(this.timer);
        updateMusicUI(false);
      }

      toggle() {
        if (this.isPlaying) this.stop();
        else this.start();
      }

      switchSong(index) {
        this.songIndex = index;
        this.noteIndex = 0;
        if (this.isPlaying) {
          clearTimeout(this.timer);
          this.scheduleNext();
        } else {
          this.start();
        }
      }
    }

    const musicBox = new ChristmasMusicBox();
    const musicBtn = document.getElementById('musicBtn');
    const musicText = document.getElementById('musicText');
    const musicToast = document.getElementById('musicToast');

    function updateMusicUI(playing) {
      if (playing) {
        musicBtn.classList.add('playing');
        musicText.textContent = '音乐播放中';
        musicToast.classList.add('hidden');
      } else {
        musicBtn.classList.remove('playing');
        musicText.textContent = '已静音';
      }
    }

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      musicBox.toggle();
    });

    // 用户首次触碰屏幕自动开启音乐（符合浏览器音频策略）
    let firstTouchDone = false;
    function handleFirstInteraction() {
      if (!firstTouchDone) {
        firstTouchDone = true;
        musicBox.start();
      }
    }
    window.addEventListener('pointerdown', handleFirstInteraction, { once: true });

    // ==================== 2. Three.js 3D 圣诞树场景 ====================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060a14, 0.018);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 7, 26);
    camera.lookAt(0, 6.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 生成圆形发光粒子贴图
    function createGlowTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255, 255, 255, 1)');
      g.addColorStop(0.25, 'rgba(255, 245, 210, 0.85)');
      g.addColorStop(0.6, 'rgba(255, 210, 120, 0.25)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }
    const glowTex = createGlowTexture();

    const themes = {
      classic: {
        tree: [0x1b7a3d, 0x28a745, 0xff3b3b, 0xffd700, 0xffffff],
        ribbon: [0xffd700, 0xff4d4d],
        star: 0xffd700
      },
      frozen: {
        tree: [0x38bdf8, 0x7dd3fc, 0xe0f2fe, 0xffffff, 0x818cf8],
        ribbon: [0xbae6fd, 0xffffff],
        star: 0xe0f2fe
      },
      gold: {
        tree: [0xfbbf24, 0xf59e0b, 0xfef08a, 0xffffff, 0xd97706],
        ribbon: [0xffffff, 0xfde047],
        star: 0xfffbeb
      },
      galaxy: {
        tree: [0xc084fc, 0xf472b6, 0x60a5fa, 0xfacc15, 0x34d399],
        ribbon: [0xf472b6, 0x38bdf8],
        star: 0xfef08a
      }
    };
    let currentTheme = 'classic';

    const treeGroup = new THREE.Group();
    scene.add(treeGroup);

    // 圣诞树主体粒子
    const TREE_COUNT = 4200;
    const treeGeo = new THREE.BufferGeometry();
    const treePos = new Float32Array(TREE_COUNT * 3);
    const treeCol = new Float32Array(TREE_COUNT * 3);
    const treeBasePos = [];

    for (let i = 0; i < TREE_COUNT; i++) {
      const h = Math.random() * 14; // 高度 0 ~ 14
      const progress = h / 14;
      // 层叠松枝轮廓波浪
      const tierWave = 1 + 0.18 * Math.sin(progress * Math.PI * 10);
      const maxR = (1 - progress) * 5.6 * tierWave;
      const r = Math.pow(Math.random(), 0.55) * maxR;
      const angle = Math.random() * Math.PI * 2;

      const x = Math.cos(angle) * r;
      const y = h;
      const z = Math.sin(angle) * r;

      treePos[i * 3] = x;
      treePos[i * 3 + 1] = y;
      treePos[i * 3 + 2] = z;
      treeBasePos.push({ x, y, z, phase: Math.random() * Math.PI * 2 });
    }
    treeGeo.setAttribute('position', new THREE.BufferAttribute(treePos, 3));
    treeGeo.setAttribute('color', new THREE.BufferAttribute(treeCol, 3));

    const treeMat = new THREE.PointsMaterial({
      size: 0.26,
      map: glowTex,
      vertexColors: true,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const treePoints = new THREE.Points(treeGeo, treeMat);
    treeGroup.add(treePoints);

    // 双螺旋彩灯带
    const RIBBON_COUNT = 900;
    const ribbonGeo = new THREE.BufferGeometry();
    const ribbonPos = new Float32Array(RIBBON_COUNT * 3);
    const ribbonCol = new Float32Array(RIBBON_COUNT * 3);

    for (let i = 0; i < RIBBON_COUNT; i++) {
      const strand = i % 2;
      const t = Math.floor(i / 2) / (RIBBON_COUNT / 2);
      const y = t * 13.8;
      const r = (1 - t) * 5.8 + 0.25;
      const angle = t * Math.PI * 9 + strand * Math.PI;
      ribbonPos[i * 3] = Math.cos(angle) * r;
      ribbonPos[i * 3 + 1] = y;
      ribbonPos[i * 3 + 2] = Math.sin(angle) * r;
    }
    ribbonGeo.setAttribute('position', new THREE.BufferAttribute(ribbonPos, 3));
    ribbonGeo.setAttribute('color', new THREE.BufferAttribute(ribbonCol, 3));

    const ribbonMat = new THREE.PointsMaterial({
      size: 0.34,
      map: glowTex,
      vertexColors: true,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const ribbonPoints = new THREE.Points(ribbonGeo, ribbonMat);
    treeGroup.add(ribbonPoints);

    // 树顶五角星
    function createStarMesh() {
      const shape = new THREE.Shape();
      const spikes = 5;
      const outerR = 0.95;
      const innerR = 0.42;
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (i * Math.PI) / spikes - Math.PI / 2;
        const x = Math.cos(a) * r;
        const y = -Math.sin(a) * r;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.22,
        bevelEnabled: true,
        bevelThickness: 0.06,
        bevelSize: 0.06,
        bevelSegments: 2
      });
      geo.center();
      const mat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
      return new THREE.Mesh(geo, mat);
    }
    const topStar = createStarMesh();
    topStar.position.set(0, 14.55, 0);
    treeGroup.add(topStar);

    const starHalo = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: glowTex,
        color: 0xffd700,
        transparent: true,
        blending: THREE.AdditiveBlending
      })
    );
    starHalo.scale.set(4.2, 4.2, 1);
    starHalo.position.set(0, 14.55, 0);
    treeGroup.add(starHalo);

    // 树底魔法光环
    const ringGeo = new THREE.RingGeometry(0.2, 6.8, 64);
    ringGeo.rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffd700,
      transparent: true,
      opacity: 0.14,
      side: THREE.DoubleSide
    });
    const baseRing = new THREE.Mesh(ringGeo, ringMat);
    baseRing.position.y = -0.1;
    treeGroup.add(baseRing);

    function applyThemeColors(name) {
      currentTheme = name;
      const cfg = themes[name];
      const tColors = treeGeo.attributes.color.array;
      for (let i = 0; i < TREE_COUNT; i++) {
        const hex = cfg.tree[Math.floor(Math.random() * cfg.tree.length)];
        const c = new THREE.Color(hex);
        tColors[i * 3] = c.r;
        tColors[i * 3 + 1] = c.g;
        tColors[i * 3 + 2] = c.b;
      }
      treeGeo.attributes.color.needsUpdate = true;

      const rColors = ribbonGeo.attributes.color.array;
      for (let i = 0; i < RIBBON_COUNT; i++) {
        const hex = cfg.ribbon[i % cfg.ribbon.length];
        const c = new THREE.Color(hex);
        rColors[i * 3] = c.r;
        rColors[i * 3 + 1] = c.g;
        rColors[i * 3 + 2] = c.b;
      }
      ribbonGeo.attributes.color.needsUpdate = true;

      topStar.material.color.setHex(cfg.star);
      starHalo.material.color.setHex(cfg.star);
      ringMat.color.setHex(cfg.star);
    }
    applyThemeColors('classic');

    // ==================== 3. 漫天飘雪系统 ====================
    const MAX_SNOW = 2000;
    let activeSnow = 1000;
    const snowGeo = new THREE.BufferGeometry();
    const snowPos = new Float32Array(MAX_SNOW * 3);
    const snowVel = [];
    for (let i = 0; i < MAX_SNOW; i++) {
      snowPos[i * 3] = (Math.random() - 0.5) * 48;
      snowPos[i * 3 + 1] = Math.random() * 28 - 2;
      snowPos[i * 3 + 2] = (Math.random() - 0.5) * 48;
      snowVel.push({
        y: 0.02 + Math.random() * 0.04,
        drift: Math.random() * Math.PI * 2
      });
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
    snowGeo.setDrawRange(0, activeSnow);

    const snowMat = new THREE.PointsMaterial({
      size: 0.24,
      map: glowTex,
      color: 0xffffff,
      transparent: true,
      opacity: 0.85,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const snowPoints = new THREE.Points(snowGeo, snowMat);
    scene.add(snowPoints);

    // ==================== 4. 交互式 3D 烟花系统 ====================
    const fireworks = [];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const hitPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    function spawnFirework(pos) {
      const count = 90;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const velocities = [];

      const palette = [0xff4d6d, 0xffd166, 0x06d6a0, 0x4cc9f0, 0xc77dff, 0xffffff];
      const baseColor = new THREE.Color(palette[Math.floor(Math.random() * palette.length)]);

      for (let i = 0; i < count; i++) {
        positions[i * 3] = pos.x;
        positions[i * 3 + 1] = pos.y;
        positions[i * 3 + 2] = pos.z;

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const speed = 0.08 + Math.random() * 0.16;

        velocities.push(
          new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta) * speed,
            Math.cos(phi) * speed,
            Math.sin(phi) * Math.sin(theta) * speed
          )
        );

        const c = baseColor.clone().offsetHSL((Math.random() - 0.5) * 0.12, 0, 0.1);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.35,
        map: glowTex,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);
      fireworks.push({ points, velocities, life: 1.0 });
      musicBox.playSparkle();
    }

    // ==================== 5. 触控旋转、缩放与点击烟花 ====================
    let isDragging = false;
    let dragDistance = 0;
    let prevX = 0;
    let prevY = 0;
    let rotSpeed = 1.0;
    let cameraRadius = 26;
    let cameraAngleY = 0;
    let cameraHeight = 7;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragDistance = 0;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      dragDistance += Math.abs(dx) + Math.abs(dy);
      prevX = e.clientX;
      prevY = e.clientY;

      cameraAngleY -= dx * 0.008;
      cameraHeight = Math.max(1, Math.min(18, cameraHeight + dy * 0.04));
    });

    window.addEventListener('pointerup', (e) => {
      if (isDragging && dragDistance < 8) {
        // 轻点屏幕放烟花
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const target = new THREE.Vector3();
        hitPlane.normal.copy(camera.position).normalize();
        raycaster.ray.intersectPlane(hitPlane, target);
        if (target) spawnFirework(target);
      }
      isDragging = false;
    });

    window.addEventListener('wheel', (e) => {
      cameraRadius = Math.max(12, Math.min(42, cameraRadius + e.deltaY * 0.015));
    }, { passive: true });

    // ==================== 6. UI 控制面板绑定 ====================
    const panelBtn = document.getElementById('panelBtn');
    const controlPanel = document.getElementById('controlPanel');
    panelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      controlPanel.classList.toggle('open');
    });

    document.querySelectorAll('[data-theme]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('[data-theme]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyThemeColors(btn.dataset.theme);
      });
    });

    document.querySelectorAll('[data-song]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('[data-song]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        musicBox.switchSong(Number(btn.dataset.song));
      });
    });

    const speedRange = document.getElementById('speedRange');
    const speedVal = document.getElementById('speedVal');
    speedRange.addEventListener('input', (e) => {
      rotSpeed = parseFloat(e.target.value);
      speedVal.textContent = rotSpeed.toFixed(1) + 'x';
    });

    const snowRange = document.getElementById('snowRange');
    const snowVal = document.getElementById('snowVal');
    snowRange.addEventListener('input', (e) => {
      activeSnow = parseInt(e.target.value, 10);
      snowGeo.setDrawRange(0, activeSnow);
      snowVal.textContent = activeSnow < 600 ? '小' : activeSnow < 1400 ? '中' : '暴雪';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==================== 7. 主动画循环 ====================
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // 圣诞树自转与呼吸微动
      treeGroup.rotation.y += 0.004 * rotSpeed;
      topStar.rotation.y = t * 1.4;
      const pulse = 3.8 + Math.sin(t * 3.5) * 0.7;
      starHalo.scale.set(pulse, pulse, 1);

      const tArr = treeGeo.attributes.position.array;
      for (let i = 0; i < TREE_COUNT; i += 3) {
        const b = treeBasePos[i];
        tArr[i + 1] = b.y + Math.sin(t * 2 + b.phase) * 0.04;
      }
      treeGeo.attributes.position.needsUpdate = true;

      // 雪花飘落
      const sArr = snowGeo.attributes.position.array;
      for (let i = 0; i < activeSnow; i++) {
        sArr[i * 3 + 1] -= snowVel[i].y;
        sArr[i * 3] += Math.sin(t + snowVel[i].drift) * 0.01;
        if (sArr[i * 3 + 1] < -2) {
          sArr[i * 3 + 1] = 24;
        }
      }
      snowGeo.attributes.position.needsUpdate = true;

      // 烟花物理更新
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.life -= 0.018;
        if (fw.life <= 0) {
          scene.remove(fw.points);
          fw.points.geometry.dispose();
          fw.points.material.dispose();
          fireworks.splice(i, 1);
          continue;
        }
        const pos = fw.points.geometry.attributes.position.array;
        for (let j = 0; j < fw.velocities.length; j++) {
          fw.velocities[j].y -= 0.0028; // 重力
          fw.velocities[j].multiplyScalar(0.98);
          pos[j * 3] += fw.velocities[j].x;
          pos[j * 3 + 1] += fw.velocities[j].y;
          pos[j * 3 + 2] += fw.velocities[j].z;
        }
        fw.points.geometry.attributes.position.needsUpdate = true;
        fw.points.material.opacity = fw.life;
      }

      // 相机环绕更新
      camera.position.x = Math.sin(cameraAngleY) * cameraRadius;
      camera.position.z = Math.cos(cameraAngleY) * cameraRadius;
      camera.position.y += (cameraHeight - camera.position.y) * 0.08;
      camera.lookAt(0, 6.5, 0);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
