<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 粒子梦幻圣诞树</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 Google Fonts 艺术字体与无衬线字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #0f1c2e 0%, #050811 100%);
            font-family: 'Noto Sans SC', sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* 圣诞艺术字发光效果 */
        .festive-font {
            font-family: 'Great Vibes', cursive;
            background: linear-gradient(to right, #fde047, #fef08a, #f59e0b, #fde047);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 25px rgba(253, 224, 71, 0.45);
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* 自定义滑块样式 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fde047;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(253, 224, 71, 0.8);
            transition: transform 0.15s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        /* 玻璃拟态面板过渡 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>

    <!-- 3D 渲染容器 -->
    <div id="canvas-container"></div>

    <!-- 顶部交互控制栏 -->
    <div class="fixed top-4 right-4 z-20 flex flex-col items-end">
        <!-- 折叠/展开按钮 -->
        <button id="toggle-panel-btn" class="glass-panel px-4 py-2.5 rounded-full text-sm font-medium text-amber-200 hover:text-white hover:border-amber-300/50 transition-all flex items-center gap-2 shadow-lg">
            <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
            </svg>
            <span>魔法控制台</span>
        </button>

        <!-- 控制面板主体 -->
        <div id="control-panel" class="glass-panel mt-3 p-5 rounded-2xl w-72 sm:w-80 transition-all duration-300 origin-top-right">
            <!-- 灯光主题选择 -->
            <div class="mb-5">
                <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2.5">灯光氛围主题</label>
                <div class="grid grid-cols-2 gap-2" id="theme-buttons">
                    <button data-theme="classic" class="theme-btn active flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium bg-white/15 border border-amber-400/60 text-white transition-all">
                        <span class="w-3 h-3 rounded-full bg-gradient-to-tr from-red-500 via-emerald-400 to-amber-300"></span>
                        经典暖彩
                    </button>
                    <button data-theme="frozen" class="theme-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all">
                        <span class="w-3 h-3 rounded-full bg-gradient-to-tr from-blue-500 via-cyan-300 to-white"></span>
                        冰雪奇缘
                    </button>
                    <button data-theme="gold" class="theme-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all">
                        <span class="w-3 h-3 rounded-full bg-gradient-to-tr from-amber-600 via-yellow-300 to-orange-200"></span>
                        流金岁月
                    </button>
                    <button data-theme="cyber" class="theme-btn flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 transition-all">
                        <span class="w-3 h-3 rounded-full bg-gradient-to-tr from-fuchsia-500 via-purple-400 to-cyan-400"></span>
                        幻彩星河
                    </button>
                </div>
            </div>

            <!-- 旋转速度控制 -->
            <div class="mb-5">
                <div class="flex justify-between items-center mb-1.5">
                    <label for="speed-slider" class="text-xs font-medium text-slate-300">旋转速度</label>
                    <span id="speed-value" class="text-xs font-mono text-amber-300">1.0x</span>
                </div>
                <input type="range" id="speed-slider" min="0" max="4" step="0.1" value="1">
            </div>

            <!-- 降雪密度控制 -->
            <div class="mb-4">
                <div class="flex justify-between items-center mb-1.5">
                    <label for="snow-slider" class="text-xs font-medium text-slate-300">漫天飞雪</label>
                    <span id="snow-value" class="text-xs font-mono text-cyan-300">适中</span>
                </div>
                <input type="range" id="snow-slider" min="0" max="1" step="0.05" value="0.7">
            </div>

            <!-- 底部操作提示 -->
            <div class="pt-3 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
                <span>✨ 点击画面绽放烟花</span>
                <span>🖱️ 拖拽旋转视角</span>
            </div>
        </div>
    </div>

    <!-- 底部圣诞祝福语 -->
    <div class="fixed bottom-6 sm:bottom-8 left-0 w-full z-10 pointer-events-none flex flex-col items-center justify-center px-4 text-center">
        <h1 class="festive-font text-5xl sm:text-7xl md:text-8xl tracking-wide leading-tight select-none">
            Merry Christmas
        </h1>
        <p class="mt-1 sm:mt-2 text-xs sm:text-sm md:text-base tracking-[0.25em] text-amber-100/80 font-light drop-shadow">
            愿星光与温暖常伴你左右 · 圣诞快乐
        </p>
    </div>

    <script>
        /**
         * 3D 粒子动态圣诞树核心逻辑
         * 包含：螺旋圣诞树粒子、树顶五角星、飘落雪花、地面光环、交互烟花爆炸特效
         */
        let scene, camera, renderer;
        let treeGroup, treeParticles, spiralParticles, starMesh, starGlowMesh, groundRings;
        let snowSystem, snowVelocities;
        let fireworks = []; // 存储活跃的烟花粒子系统

        // 交互与控制状态
        let config = {
            rotationSpeed: 1.0,
            snowIntensity: 0.7,
            currentTheme: 'classic'
        };

        // 鼠标/触摸拖拽视角状态
        let isDragging = false;
        let pointerDownPos = { x: 0, y: 0 };
        let previousPointer = { x: 0, y: 0 };
        let cameraAngle = { theta: 0, phi: 0.15 };
        let targetCameraAngle = { theta: 0, phi: 0.15 };
        let cameraDistance = 26;

        // 灯光配色方案定义
        const THEMES = {
            classic: {
                tree: [0x10b981, 0x059669, 0x34d399, 0xef4444, 0xfbbf24], // 祖母绿、圣诞红、暖金
                spiral: [0xfde047, 0xff4d4d, 0x38bdf8, 0xfbbf24],
                star: 0xffe066,
                firework: [0xff4d4d, 0xfde047, 0x34d399, 0x60a5fa, 0xf472b6]
            },
            frozen: {
                tree: [0x0284c7, 0x38bdf8, 0x7dd3fc, 0xe0f2fe, 0xffffff], // 冰蓝、浅青、纯白
                spiral: [0xffffff, 0x38bdf8, 0x818cf8, 0xbae6fd],
                star: 0xe0f2fe,
                firework: [0x38bdf8, 0x818cf8, 0xe0f2fe, 0x2dd4bf, 0xffffff]
            },
            gold: {
                tree: [0xd97706, 0xf59e0b, 0xfbbf24, 0xfef08a, 0x78350f], // 琥珀金、香槟金
                spiral: [0xffffff, 0xfde047, 0xf97316, 0xfef08a],
                star: 0xfffbeb,
                firework: [0xfde047, 0xf59e0b, 0xfb923c, 0xffffff, 0xfef08a]
            },
            cyber: {
                tree: [0xc026d3, 0x9333ea, 0x4f46e5, 0x06b6d4, 0xf43f5e], // 霓虹紫、赛博青、洋红
                spiral: [0x22d3ee, 0xf472b6, 0xa855f7, 0xfde047],
                star: 0xf0abfc,
                firework: [0xe879f9, 0x22d3ee, 0xf43f5e, 0x818cf8, 0xfacc15]
            }
        };

        // 创建柔和发光粒子纹理（使用 Canvas 动态绘制，无需外部图片）
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.25, 'rgba(255, 255, 255, 0.85)');
            gradient.addColorStop(0.55, 'rgba(255, 255, 255, 0.25)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // 创建六角雪花纹理
        function createSnowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.4, 'rgba(224, 242, 254, 0.7)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            return new THREE.CanvasTexture(canvas);
        }

        const glowTexture = createGlowTexture();
        const snowTexture = createSnowTexture();

        // 初始化 Three.js 场景
        function initScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x060b16, 0.018);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 环境光与点光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const starPointLight = new THREE.PointLight(0xffe066, 2, 25);
            starPointLight.position.set(0, 9.5, 0);
            scene.add(starPointLight);

            // 创建圣诞树整体组
            treeGroup = new THREE.Group();
            scene.add(treeGroup);

            buildChristmasTree();
            buildSpiralGarland();
            buildTreeTopStar();
            buildGroundRings();
            buildSnowfall();

            bindEvents();
        }

        // 1. 构建圣诞树主体粒子（分层圆锥体结构，模拟松枝层次）
        function buildChristmasTree() {
            const particleCount = 4500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const initialData = []; // 保存初始角度和高度用于呼吸动画

            const treeHeight = 15;
            const baseRadius = 5.8;
            const palette = THEMES[config.currentTheme].tree;

            for (let i = 0; i < particleCount; i++) {
                // 高度分布：底部更密集
                const progress = Math.pow(Math.random(), 0.85);
                const y = progress * treeHeight - treeHeight / 2;

                // 模拟树枝层叠波浪效果
                const layerWave = Math.sin(progress * Math.PI * 12) * 0.25 * (1 - progress);
                const maxR = (1 - progress) * baseRadius + layerWave;
                // 粒子主要集中在树冠外层，内部少量填充
                const r = maxR * (0.35 + 0.65 * Math.sqrt(Math.random()));
                const angle = Math.random() * Math.PI * 2;

                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // 随机选取主题色
                const colorHex = palette[Math.floor(Math.random() * palette.length)];
                const color = new THREE.Color(colorHex);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                sizes[i] = Math.random() * 0.35 + 0.15;

                initialData.push({
                    angle,
                    radius: r,
                    y,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1.5
                });
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.userData = { initialData };

            const material = new THREE.PointsMaterial({
                size: 0.32,
                map: glowTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            treeParticles = new THREE.Points(geometry, material);
            treeGroup.add(treeParticles);
        }

        // 2. 构建环绕圣诞树的双螺旋彩色流光灯带
        function buildSpiralGarland() {
            const count = 900;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const palette = THEMES[config.currentTheme].spiral;

            const treeHeight = 15.2;
            const baseRadius = 6.1;
            const turns = 5.5; // 螺旋圈数

            for (let i = 0; i < count; i++) {
                const strand = i % 2; // 双螺旋
                const t = i / count;
                const y = t * treeHeight - treeHeight / 2;
                const radius = (1 - t) * baseRadius + 0.15;
                const angle = t * Math.PI * 2 * turns + strand * Math.PI;

                // 轻微散射让灯带更自然
                const spread = 0.18;
                positions[i * 3] = Math.cos(angle) * radius + (Math.random() - 0.5) * spread;
                positions[i * 3 + 1] = y + (Math.random() - 0.5) * spread;
                positions[i * 3 + 2] = Math.sin(angle) * radius + (Math.random() - 0.5) * spread;

                const color = new THREE.Color(palette[i % palette.length]);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.45,
                map: glowTexture,
                vertexColors: true,
                transparent: true,
                opacity: 1,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            spiralParticles = new THREE.Points(geometry, material);
            treeGroup.add(spiralParticles);
        }

        // 3. 构建树顶3D立体五角星及外围光晕
        function buildTreeTopStar() {
            const starShape = new THREE.Shape();
            const outerRadius = 1.15;
            const innerRadius = 0.48;
            const spikes = 5;

            for (let i = 0; i < spikes * 2; i++) {
                const r = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / spikes + Math.PI / 2;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) starShape.moveTo(x, y);
                else starShape.lineTo(x, y);
            }
            starShape.closePath();

            const extrudeSettings = {
                depth: 0.28,
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 1,
                bevelSize: 0.08,
                bevelThickness: 0.08
            };

            const geometry = new THREE.ExtrudeGeometry(starShape, extrudeSettings);
            geometry.center();

            const material = new THREE.MeshStandardMaterial({
                color: THEMES[config.currentTheme].star,
                emissive: THEMES[config.currentTheme].star,
                emissiveIntensity: 0.9,
                roughness: 0.2,
                metalness: 0.8
            });

            starMesh = new THREE.Mesh(geometry, material);
            starMesh.position.set(0, 8.1, 0);
            treeGroup.add(starMesh);

            // 添加星星外围光晕精灵
            const spriteMat = new THREE.SpriteMaterial({
                map: glowTexture,
                color: THEMES[config.currentTheme].star,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            starGlowMesh = new THREE.Sprite(spriteMat);
            starGlowMesh.scale.set(4.5, 4.5, 1);
            starMesh.add(starGlowMesh);
        }

        // 4. 构建树底魔法波纹光环
        function buildGroundRings() {
            groundRings = new THREE.Group();
            groundRings.position.y = -7.6;

            const ringRadii = [3.5, 5.2, 7.0];
            ringRadii.forEach((radius, idx) => {
                const count = 180 + idx * 60;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    pos[i * 3] = Math.cos(angle) * radius;
                    pos[i * 3 + 1] = 0;
                    pos[i * 3 + 2] = Math.sin(angle) * radius;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.22,
                    map: glowTexture,
                    color: 0xfde047,
                    transparent: true,
                    opacity: 0.45 - idx * 0.1,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });

                const ring = new THREE.Points(geo, mat);
                ring.userData = { speed: (idx % 2 === 0 ? 1 : -1) * (0.2 + idx * 0.1) };
                groundRings.add(ring);
            });

            scene.add(groundRings);
        }

        // 5. 构建漫天飘落的雪花系统
        function buildSnowfall() {
            const maxSnow = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(maxSnow * 3);
            snowVelocities = [];

            for (let i = 0; i < maxSnow; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 55;
                positions[i * 3 + 1] = Math.random() * 35 - 10;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 55;

                snowVelocities.push({
                    y: 0.03 + Math.random() * 0.06,
                    xDrift: (Math.random() - 0.5) * 0.02,
                    zDrift: (Math.random() - 0.5) * 0.02,
                    phase: Math.random() * Math.PI * 2
                });
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setDrawRange(0, Math.floor(maxSnow * config.snowIntensity));

            const material = new THREE.PointsMaterial({
                size: 0.42,
                map: snowTexture,
                color: 0xffffff,
                transparent: true,
                opacity: 0.85,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            snowSystem = new THREE.Points(geometry, material);
            scene.add(snowSystem);
        }

        // 6. 点击屏幕在3D空间产生绚丽烟花/光晕爆炸特效
        function spawnFirework(ndcX, ndcY) {
            // 将屏幕点击坐标投射到3D空间中距离相机一定深度的位置
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);

            const targetPoint = new THREE.Vector3();
            // 在圣诞树附近的深度平面生成烟花
            const distance = 18 + Math.random() * 8;
            raycaster.ray.at(distance, targetPoint);

            const particleCount = 140;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const velocities = [];

            const palette = THEMES[config.currentTheme].firework;
            const baseColorHex = palette[Math.floor(Math.random() * palette.length)];
            const secondaryColorHex = palette[Math.floor(Math.random() * palette.length)];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = targetPoint.x;
                positions[i * 3 + 1] = targetPoint.y;
                positions[i * 3 + 2] = targetPoint.z;

                // 球形均匀爆发速度
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const speed = 0.08 + Math.random() * 0.22;

                velocities.push({
                    x: speed * Math.sin(phi) * Math.cos(theta),
                    y: speed * Math.sin(phi) * Math.sin(theta),
                    z: speed * Math.cos(phi)
                });

                const c = new THREE.Color(Math.random() > 0.35 ? baseColorHex : secondaryColorHex);
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.55,
                map: glowTexture,
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            // 中心闪光光晕
            const flashMat = new THREE.SpriteMaterial({
                map: glowTexture,
                color: baseColorHex,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending
            });
            const flashSprite = new THREE.Sprite(flashMat);
            flashSprite.position.copy(targetPoint);
            flashSprite.scale.set(5, 5, 1);
            scene.add(flashSprite);

            fireworks.push({
                points,
                flashSprite,
                velocities,
                life: 1.0,
                decay: 0.015 + Math.random() * 0.008
            });
        }

        // 切换灯光主题颜色
        function applyTheme(themeKey) {
            config.currentTheme = themeKey;
            const theme = THEMES[themeKey];

            // 更新圣诞树粒子颜色
            const treeColors = treeParticles.geometry.attributes.color.array;
            for (let i = 0; i < treeColors.length; i += 3) {
                const hex = theme.tree[Math.floor(Math.random() * theme.tree.length)];
                const c = new THREE.Color(hex);
                treeColors[i] = c.r;
                treeColors[i + 1] = c.g;
                treeColors[i + 2] = c.b;
            }
            treeParticles.geometry.attributes.color.needsUpdate = true;

            // 更新螺旋灯带颜色
            const spiralColors = spiralParticles.geometry.attributes.color.array;
            for (let i = 0; i < spiralColors.length; i += 3) {
                const hex = theme.spiral[(i / 3) % theme.spiral.length];
                const c = new THREE.Color(hex);
                spiralColors[i] = c.r;
                spiralColors[i + 1] = c.g;
                spiralColors[i + 2] = c.b;
            }
            spiralParticles.geometry.attributes.color.needsUpdate = true;

            // 更新树顶星星颜色
            starMesh.material.color.setHex(theme.star);
            starMesh.material.emissive.setHex(theme.star);
            starGlowMesh.material.color.setHex(theme.star);

            // 更新底部光环颜色
            groundRings.children.forEach(ring => {
                ring.material.color.setHex(theme.star);
            });
        }

        // 更新相机轨道位置
        function updateCameraPosition() {
            camera.position.x = cameraDistance * Math.sin(cameraAngle.theta) * Math.cos(cameraAngle.phi);
            camera.position.y = cameraDistance * Math.sin(cameraAngle.phi) + 1.5;
            camera.position.z = cameraDistance * Math.cos(cameraAngle.theta) * Math.cos(cameraAngle.phi);
            camera.lookAt(0, 0.5, 0);
        }

        // 绑定UI与画布交互事件
        function bindEvents() {
            const container = document.getElementById('canvas-container');

            // 指针按下
            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                pointerDownPos = { x: e.clientX, y: e.clientY };
                previousPointer = { x: e.clientX, y: e.clientY };
            });

            // 指针移动（旋转视角）
            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousPointer.x;
                const deltaY = e.clientY - previousPointer.y;

                targetCameraAngle.theta -= deltaX * 0.007;
                targetCameraAngle.phi = Math.max(-0.25, Math.min(0.75, targetCameraAngle.phi + deltaY * 0.005));

                previousPointer = { x: e.clientX, y: e.clientY };
            });

            // 指针抬起（判断是点击还是拖拽）
            window.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;

                const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                // 如果移动距离小于 6px，视为点击屏幕，触发烟花特效
                if (moveDist < 6) {
                    const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
                    const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;
                    spawnFirework(ndcX, ndcY);
                }
            });

            // 滚轮缩放视角
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                cameraDistance = Math.max(14, Math.min(42, cameraDistance + e.deltaY * 0.015));
            }, { passive: false });

            // 窗口自适应
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 控制面板折叠/展开
            const toggleBtn = document.getElementById('toggle-panel-btn');
            const controlPanel = document.getElementById('control-panel');
            let isPanelOpen = true;
            toggleBtn.addEventListener('click', () => {
                isPanelOpen = !isPanelOpen;
                if (isPanelOpen) {
                    controlPanel.classList.remove('scale-90', 'opacity-0', 'pointer-events-none');
                    controlPanel.classList.add('scale-100', 'opacity-100');
                } else {
                    controlPanel.classList.remove('scale-100', 'opacity-100');
                    controlPanel.classList.add('scale-90', 'opacity-0', 'pointer-events-none');
                }
            });

            // 灯光主题切换按钮
            const themeBtns = document.querySelectorAll('.theme-btn');
            themeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    themeBtns.forEach(b => {
                        b.classList.remove('bg-white/15', 'border-amber-400/60', 'text-white');
                        b.classList.add('bg-white/5', 'border-white/10', 'text-slate-300');
                    });
                    btn.classList.remove('bg-white/5', 'border-white/10', 'text-slate-300');
                    btn.classList.add('bg-white/15', 'border-amber-400/60', 'text-white');

                    applyTheme(btn.dataset.theme);
                });
            });

            // 旋转速度滑块
            const speedSlider = document.getElementById('speed-slider');
            const speedValue = document.getElementById('speed-value');
            speedSlider.addEventListener('input', (e) => {
                config.rotationSpeed = parseFloat(e.target.value);
                speedValue.textContent = config.rotationSpeed.toFixed(1) + 'x';
            });

            // 雪花密度滑块
            const snowSlider = document.getElementById('snow-slider');
            const snowValue = document.getElementById('snow-value');
            snowSlider.addEventListener('input', (e) => {
                config.snowIntensity = parseFloat(e.target.value);
                const maxSnow = snowVelocities.length;
                snowSystem.geometry.setDrawRange(0, Math.floor(maxSnow * config.snowIntensity));

                if (config.snowIntensity === 0) snowValue.textContent = '晴朗';
                else if (config.snowIntensity < 0.4) snowValue.textContent = '微雪';
                else if (config.snowIntensity < 0.8) snowValue.textContent = '适中';
                else snowValue.textContent = '鹅毛大雪';
            });
        }

        // 主渲染与动画循环
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 1. 平滑更新相机角度
            cameraAngle.theta += (targetCameraAngle.theta - cameraAngle.theta) * 0.08;
            cameraAngle.phi += (targetCameraAngle.phi - cameraAngle.phi) * 0.08;
            updateCameraPosition();

            // 2. 圣诞树旋转与螺旋流光效果
            if (treeGroup) {
                treeGroup.rotation.y += 0.006 * config.rotationSpeed;
            }
            if (spiralParticles) {
                spiralParticles.rotation.y += 0.012 * config.rotationSpeed;
            }

            // 3. 树顶五角星自转与呼吸闪烁
            if (starMesh && starGlowMesh) {
                starMesh.rotation.y = elapsedTime * 1.2;
                const pulse = 1 + Math.sin(elapsedTime * 3.5) * 0.15;
                starGlowMesh.scale.set(4.5 * pulse, 4.5 * pulse, 1);
                starMesh.material.emissiveIntensity = 0.75 + Math.sin(elapsedTime * 4) * 0.25;
            }

            // 4. 圣诞树粒子微弱呼吸浮动
            if (treeParticles) {
                const posAttr = treeParticles.geometry.attributes.position;
                const initData = treeParticles.geometry.userData.initialData;
                for (let i = 0; i < initData.length; i++) {
                    const d = initData[i];
                    const wave = Math.sin(elapsedTime * d.speed + d.phase) * 0.06;
                    posAttr.array[i * 3 + 1] = d.y + wave;
                }
                posAttr.needsUpdate = true;
            }

            // 5. 地面魔法光环旋转
            if (groundRings) {
                groundRings.children.forEach(ring => {
                    ring.rotation.y += ring.userData.speed * 0.01 * config.rotationSpeed;
                });
            }

            // 6. 雪花飘落物理更新
            if (snowSystem && config.snowIntensity > 0) {
                const snowPos = snowSystem.geometry.attributes.position.array;
                const activeCount = Math.floor(snowVelocities.length * config.snowIntensity);

                for (let i = 0; i < activeCount; i++) {
                    const vel = snowVelocities[i];
                    snowPos[i * 3 + 1] -= vel.y;
                    snowPos[i * 3] += vel.xDrift + Math.sin(elapsedTime + vel.phase) * 0.012;
                    snowPos[i * 3 + 2] += vel.zDrift + Math.cos(elapsedTime + vel.phase) * 0.012;

                    // 落到底部后重新回到顶部循环
                    if (snowPos[i * 3 + 1] < -10) {
                        snowPos[i * 3 + 1] = 25;
                        snowPos[i * 3] = (Math.random() - 0.5) * 55;
                        snowPos[i * 3 + 2] = (Math.random() - 0.5) * 55;
                    }
                }
                snowSystem.geometry.attributes.position.needsUpdate = true;
            }

            // 7. 烟花粒子扩散、重力下坠与淡出更新
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                fw.life -= fw.decay;

                if (fw.life <= 0) {
                    scene.remove(fw.points);
                    scene.remove(fw.flashSprite);
                    fw.points.geometry.dispose();
                    fw.points.material.dispose();
                    fw.flashSprite.material.dispose();
                    fireworks.splice(i, 1);
                    continue;
                }

                const pos = fw.points.geometry.attributes.position.array;
                for (let j = 0; j < fw.velocities.length; j++) {
                    const v = fw.velocities[j];
                    // 空气阻力与重力
                    v.x *= 0.96;
                    v.y = v.y * 0.96 - 0.0025;
                    v.z *= 0.96;

                    pos[j * 3] += v.x;
                    pos[j * 3 + 1] += v.y;
                    pos[j * 3 + 2] += v.z;
                }
                fw.points.geometry.attributes.position.needsUpdate = true;
                fw.points.material.opacity = fw.life;

                // 中心闪光快速衰减
                fw.flashSprite.material.opacity = Math.max(0, fw.life * 1.5 - 0.5);
                const flashScale = 5 * (1.3 - fw.life * 0.5);
                fw.flashSprite.scale.set(flashScale, flashScale, 1);
            }

            renderer.render(scene, camera);
        }

        // 页面加载完成后启动
        window.onload = function () {
            initScene();
            animate();
            // 初始自动在树旁绽放一朵迎宾烟花
            setTimeout(() => spawnFirework(0.35, 0.35), 800);
        };
    </script>
</body>
</html>
